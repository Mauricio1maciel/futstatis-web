# Publica o site no GitHub Pages a cada push na branch main (ou manualmente, pela aba Actions).
# Uma vez só, antes do primeiro deploy: no repositório, Settings → Pages → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um deploy em andamento termina antes do próximo começar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # base_path: "/<repositório>" quando o site fica em usuario.github.io/<repositório>;
      # vazio em site de usuário (usuario.github.io) ou com domínio próprio
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Opcional: outra API em Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
